const PAY_TIER = '💳 Начала оплату и не оплатила';
const tierName = n => n === -1 ? PAY_TIER : TIERS[n];
const AFTER_SESSION = ['Как прошла сессия','Спросить о продолжении','Предложить продление'];
const MONEY_NEAR = ['Доплата до старта','Помочь с оплатой','Назначить диагностику','Вернуться к «думает»','Отметить итог диагностики'];
const endOfToday = () => { const e = new Date(TODAY); e.setHours(23,59); return e; };
const lastSession = c => (c.sessions||[]).filter(x => x.st==='прошла').slice(-1)[0];
const justFinished = c => { const s = lastSession(c); return !!s && /^(\d+) из \1$/.test(s.n) && TODAY - s.t < 7*864e5; };
function attention(c){
  const t = c.task && !c.task.done ? c.task : null;
  if (t && t.gc) return { tier:-1, why:`Начала оплату и не оплатила · ${dueLabel(t.due)}` };
  if (c.handoffPending && !c.handoff) return { tier:0, why:'Не передан дальше после брони или покупки' };
  if (!t) return { tier:5, why: c.stage==='Клиент' ? 'Сессии идут по плану' : 'Задач нет' };
  if (t.kind==='Нет ответа после дожимов') return { tier:6, why:'Два дожима без ответа — можно переводить на кладбище лидов' };
  const why = `${t.kind} · ${dueLabel(t.due)}`;
  if (t.due < TODAY) return { tier:0, why };
  if (t.due > endOfToday()) return { tier:4, why };
  if (AFTER_SESSION.includes(t.kind)) return { tier:1, why: why + (justFinished(c) ? ' · продукт закончился' : '') };
  if (MONEY_NEAR.includes(t.kind) || ['Бронь','Заказ без оплаты'].includes(c.stage)) return { tier:2, why };
  return { tier:3, why };
}
// температура: из того, что менеджер отметил в карточке. Личную переписку система не видит
function temperature(c){
  const now = TODAY.getTime(), T = c.touches || [];
  let s = 0;
  if (T.some(x => now - x.t < 864e5 && (/^Ответила|^Купила|^Хочет/.test(x.res) || x.what==='Клиентка написала сама'))) s += 3;
  if (T.some(x => x.what==='Клиентка написала сама' && now - x.t < 864e5)) s += 2;
  if (/Очень важно/.test(c.ready || '')) s += 2; else if (/сомнения/.test(c.ready || '')) s += 1;
  if (/^(150|300)/.test(c.income || '')) s += 1;
  if (c.diag || ['Диагностика оплачена','Диагностика назначена'].includes(c.stage)) s += 2;
  if (c.stage==='Бронь') s += 3;
  const ls = lastSession(c);
  if (justFinished(c)) s += 4; else if (ls && now - ls.t < 2*864e5) s += 3;
  s -= 2 * T.filter(x => /^Дожим/.test(x.what)).length;
  const last = T.slice(-1)[0];
  if (last && /Не отвечает|жду ответа|Отправила дожим/.test(last.res) && now - last.t > 864e5) s -= 2;
  return s;
}
const tempPill = s => s >= 5 ? '<span class="pill warn">🔥 горячая</span>' : s >= 2 ? '<span class="pill acc">тёплая</span>' : '<span class="pill">холодная</span>';
const dueOf = c => c.task && !c.task.done ? c.task.due.getTime() : Infinity;
const rankCmp = (x, y) => x.a.tier - y.a.tier || (x.a.tier===1 ? justFinished(y.c) - justFinished(x.c) : 0) || (dueOf(x.c) - dueOf(y.c)) || (y.t - x.t);

// всё считается из карточек: анкеты, отметки касаний, оплаты, сессии из календаря
const MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const inMonth = d => !!d && d.getFullYear()===TODAY.getFullYear() && d.getMonth()===TODAY.getMonth();
const monthTitle = () => `${MONTHS_NOM[TODAY.getMonth()]} ${TODAY.getFullYear()}, с 1 по ${TODAY.getDate()} число`;
const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
const STAGE_RANK = { 'Написала':1, 'Анкета отправлена':1, 'Диалог':2, 'Заказ без оплаты':2, 'Диагностика оплачена':3, 'Диагностика назначена':3,
  'Диагностика проведена':4, 'Думает':4, 'Бронь':5, 'Клиент':5, 'Завершила':5 };
const isManagerTouch = t => t.who && !['система','—'].includes(t.who) && t.from !== 'CRM-таблица' || (t.from === 'CRM-таблица' && t.what === 'Написала после анкеты');
// докуда дошёл человек по воронке: 1 написали · 2 ответила · 3 купила диагностику · 4 провели · 5 купила продукт
function reached(c){
  let r = STAGE_RANK[c.stage] || 0;
  const T = c.touches || [];
  if (T.some(isManagerTouch)) r = Math.max(r, 1);
  if (T.some(t => /^Ответила|^Хочет|^Купила|написала сама/i.test(t.res || '') || t.what === 'Клиентка написала сама')) r = Math.max(r, 2);
  if ((c.deals || []).some(d => d.p === 'Диагностика')) r = Math.max(r, 3);
  if (c.diag && /^Проведена/.test(c.diag.res || '')) r = Math.max(r, 4);
  if ((c.deals || []).some(d => d.p !== 'Диагностика')) r = Math.max(r, 5);
  return r;
}
const firstTouchHours = c => { const t = (c.touches || []).filter(isManagerTouch).map(x => x.t).filter(x => x >= c.at).sort((a, b) => a - b)[0]; return t ? (t - c.at) / 36e5 : null; };
function afterSessionOnTime(list){
  const S = []; list.forEach(c => (c.sessions || []).forEach(s => { if (s.st === 'прошла' && inMonth(s.t)) S.push({ c, s }); }));
  const ok = S.filter(({ c, s }) => (c.touches || []).some(t => t.what === 'Как прошла сессия' && t.t >= s.t && t.t - (s.end || s.t) <= 864e5)).length;
  return { ok, all: S.length };
}
const monthPays = () => payments().filter(x => inMonth(x.p.t));
// начисления менеджеру и РОП за месяц — по правилам из CLAUDE.md проекта
// тренинг 5 декабря (решение 29.10): процентов нет — 500 / 750 ₽ за место по своей ссылке; выручка по своей ссылке идёт в личный план,
// в порог команды — только оплаты по ссылкам менеджеров; Лере премия 5 000, если на 5 декабря продано 50 мест
const isTraining = x => /^Тренинг 5 декабря/.test(x.d.p);
const sumOf = L => L.reduce((s, x) => s + x.p.sum, 0);
function payroll(m){
  const P = monthPays();
  const prodPays = P.filter(x => x.d.p !== 'Диагностика' && !x.p.bron);
  const own = sumOf(prodPays.filter(x => x.d.seller === m));
  const ownPct = sumOf(prodPays.filter(x => x.d.seller === m && !isTraining(x)));
  const prodAll = sumOf(prodPays.filter(x => !isTraining(x) || x.d.seller));
  const prodPct = sumOf(prodPays.filter(x => !isTraining(x)));
  const seats = prodPays.filter(x => isTraining(x) && x.d.seller === m);
  const seatSum = seats.reduce((s, x) => s + Math.sign(x.p.sum) * (/VIP/.test(x.d.p) ? 750 : 500), 0);
  const diagSold = P.filter(x => x.d.p === 'Диагностика' && x.d.seller === m).length;
  const diagDone = C.filter(c => c.diag && c.diag.by === m && inMonth(c.diag.when) && /^Проведена/.test(c.diag.res || '')).length;
  const isRop = m === 'Лера';
  const rows = [];
  if (m === 'Аня' || m === 'Ева') rows.push(['Фикс', 5000]);
  if (ownPct) rows.push([`${own >= 250000 ? 7 : 6}% с продаж продуктов (${rub(ownPct)})`, Math.round(ownPct * (own >= 250000 ? .07 : .06))]);
  if (seats.length) rows.push([`Места на тренинге 5 декабря · ${seats.reduce((s, x) => s + Math.sign(x.p.sum), 0)}`, seatSum]);
  if (diagSold) rows.push([`Продажа диагностик · ${diagSold} × 500`, diagSold * 500]);
  if (diagDone) rows.push([`Проведение диагностик · ${diagDone} × ${isRop ? '2 000' : '1 000'}`, diagDone * (isRop ? 2000 : 1000)]);
  if (isRop && prodPct) rows.push([`${prodAll >= 650000 ? 3 : 2}% РОП со всех продаж (${rub(prodPct)})`, Math.round(prodPct * (prodAll >= 650000 ? .03 : .02))]);
  if (isRop && inMonth(new Date(2026, 11, 5))) {
    const sold = payments().filter(x => isTraining(x) && !x.p.bron && x.p.t < new Date(2026, 11, 6)).reduce((s, x) => s + Math.sign(x.p.sum), 0);
    if (sold >= 50) rows.push([`Премия за полный зал тренинга · ${sold} мест на 5 декабря`, 5000]);
  }
  if (isRop){ const v = P.filter(x => x.d.p === 'Пакет 3 сессий Валерии' && !x.p.bron).length; if (v) rows.push([`Сопровождение, пакет Валерии · ${v} × 6 000`, v * 6000]); }
  return { rows, own, total: rows.reduce((s, r) => s + r[1], 0) };
}

function recordOutcome(id, val, until){
  const c = byId(id);
  if (val==='Перевести в кладбище лидов' && c.task.due > TODAY){ toast(`Рано: сутки после второго дожима пройдут ${dt(c.task.due)}`); return; }
  c._undo = structuredClone({ task:c.task, stage:c.stage, thinkUntil:c.thinkUntil, alinaVoice:c.alinaVoice, n:(c.touches||[]).length });
  c.touches = c.touches || [];
  c.touches.push({ t:new Date(TODAY), who: role==='Пётр'?'Аня':role, what:c.task.kind, res: val + (until?` — связь ${dd(until)}`:'') });
  const kind = c.task.kind;
  c.task.done = val;
  const STAGE_BY = { 'Купила диагностику':'Диагностика оплачена', 'Оплатила':'Диагностика оплачена', 'Поставила в календарь':'Диагностика назначена',
    'Купила':'Клиент', 'Купила продолжение':'Клиент', 'Доплатила':'Клиент', 'Бронь':'Бронь', 'Ответила, в диалоге':'Диалог',
    'Написала, жду ответа':'Написала', 'Отказ':'Отказ', 'Не хочет продолжать':'Завершила' };
  if (STAGE_BY[val]) c.stage = STAGE_BY[val];
  if (until){ c.thinkUntil = until; if (c.stage!=='Клиент') c.stage = 'Думает'; }
  let msg = `Записала в карточку: ${val}`;
  // лид из директа: следующий шаг — анкета, а не продажа диагностики
  const NEXT = {
    'Отправила ссылку на анкету': { stage:'Анкета отправлена', kind:'Анкета не заполнена', why:'Ссылку на анкету отправила. Не заполнит за сутки — напомнить', msg:'Записала. Не заполнит анкету за сутки — завтра в 9:00 придёт напоминание' },
    'Напомнила ещё раз': { stage:'Анкета отправлена', kind:'Анкета не заполнена', why:'Напомнила про анкету. Не заполнит — два дожима, потом «Кладбище лидов»', msg:'Записала. Проверю ещё через сутки' },
    'Заполнила анкету': { stage:'Анкета заполнена', kind:'Предложить диагностику', why:'Анкету заполнила — теперь предложить диагностику. Срок — 24 часа', msg:'Анкета в карточке. В рабочей версии это отметится само: анкета придёт из формы и найдёт карточку по нику или телефону' },
  };
  if (NEXT[val]){
    const n = NEXT[val];
    c.stage = n.stage;
    c.task = { kind:n.kind, due:new Date(TODAY.getTime()+864e5), why:n.why };
    msg = n.msg;
  }
  // после сессии: как прошла → о продолжении → предложение продления → молчит — голосовое Алины
  const lastSess = (c.sessions||[]).filter(s => s.st==='прошла').slice(-1)[0];
  const isLast = lastSess && /^(\d+) из \1$/.test(lastSess.n);
  if (kind==='Как прошла сессия' && val.startsWith('Ответила')){
    if (val.includes('отзыв')) c.review = true;
    if (isLast){ c.task = { kind:'Спросить о продолжении', due:addDays(TODAY,1), why:'Сессия была последней. Спросить, планирует ли продолжать работу с Алиной, — пока без сроков и цены' }; msg = 'Записала. Сессия была последней — завтра спросить о продолжении'; }
    else msg = 'Записала. Ждёт следующую сессию — после неё снова напомню';
  }
  if (val==='Хочет продолжить'){ c.task = { kind:'Предложить продление', due:addDays(TODAY,1), why:'Хочет продолжить. Предложить пакет 3 сессий по текущей цене 81 000 ₽ и закрепить место на 2–3 дня' }; msg = 'Записала. Следующий шаг — предложение продления'; }
  if (val==='Не отвечает' && ['Как прошла сессия','Спросить о продолжении','Предложить продление'].includes(kind)){
    c.alinaVoice = { due:addDays(TODAY,1), after:true }; msg = 'Записала. Не ответит до завтра — Алине придёт задача на голосовое с зеркала'; }
  if (val==='Не планирует'){ c.stage = 'Завершила'; msg = 'Записала. Клиентка остаётся в твоей базе — позовёшь на эфиры и практикумы'; }
  if (val==='Купила продолжение'){ c.stage = 'Клиент'; }
  if (kind==='Вернуться к «думает»' && val==='Не отвечает'){
    c.alinaVoice = { due: addDays(TODAY,1) };
    msg = 'Записала. Не ответит до завтра — Алине придёт задача на голосовое с зеркала';
  }
  // правило двух дожимов: не отвечает → дожим 1 → дожим 2 → сутки тишины → только тогда «Кладбище лидов»
  const BEFORE_SALE = ['Новая анкета','Отправить анкету','Анкета не заполнена','Предложить диагностику','Помочь с оплатой','Назначить диагностику','Касание'];
  if (val==='Не отвечает' && BEFORE_SALE.includes(kind)){
    c.task = { kind:'Дожим 1', due:addDays(TODAY,1), why:'Не отвечает. Отправь первый дожим' }; msg = 'Записала. Завтра в 9:00 — первый дожим'; }
  if (val==='Отправила дожим 1'){
    c.task = { kind:'Дожим 2', due:addDays(TODAY,2), why:`Первый дожим отправлен ${dd(TODAY)}. Ответа нет — отправь второй, последний` }; msg = 'Записала. Ответит — нажми «Ответила». Нет — через 2 дня второй дожим'; }
  if (val==='Отправила дожим 2'){
    c.task = { kind:'Нет ответа после дожимов', due:addDays(TODAY,1), why:`Второй дожим отправлен ${dt(TODAY)}. Если за сутки не ответит — переведи в кладбище лидов. Раньше нельзя` }; msg = 'Записала. Если за сутки не ответит — можно переводить в кладбище лидов'; }
  if (val==='Перевести в кладбище лидов'){
    c.graveFrom = c._undo.stage; c.stage = 'Кладбище лидов'; c.graveAt = new Date(TODAY);
    msg = 'Клиент на «Кладбище лидов» и ушёл из твоего списка. Ответит позже — вернёшь одной кнопкой'; }
  render(); toast(msg);
  if (['Бронь','Купила','Купила продолжение'].includes(val)) handoffSheet(c.id, val);
}

document.addEventListener('click', e => {
  const mx = e.target.closest('[data-maxcopy]');
  if (mx){ const c = byId(+mx.dataset.maxcopy); try { navigator.clipboard.writeText(c.phone).catch(() => {}); } catch(_) {} toast(`Номер ${c.phone} скопирован — вставь его в поиск MAX`); return; }
  const b = e.target.closest('button, [data-close], [data-sclose]'); if (!b) return;
  if (b.dataset.wademo){ toast('У тестовых клиентов номер скрыт. С настоящим номером сразу откроется чат WhatsApp'); return; }
  const d = b.dataset;
  if (d.role){ if (!ACCESS[login].includes(d.role)) return; role = d.role; tab = ROLES[role][0]; clientFilter='В работе'; render(); return; }
  if (d.tab){ tab = d.tab; render(); return; }
  if (d.open){ openCard(+d.open); return; }
  if ('close' in d){ $('#layer').innerHTML=''; return; }
  if ('sclose' in d){ closeSheet(); return; }
  if (d.filter){ clientFilter = d.filter; render(); return; }
  if ('logout' in d){ logout(); return; }
  if ('relogin' in d){ loginScreen(); return; }
  if (d.stagebtn){ stageSheet(+d.stagebtn); return; }
  if (d.compose){ composeSheet(+d.compose); return; }
  if (d.preset){ baseF = { prod: ALL_BUYERS, city:'Все', income:'Все', theme:'Все', ...(SEGMENTS[d.preset] || {}) }; baseSel.clear(); render(); return; }
  if ('invtheme' in d){ const list = baseList(); const theme = baseF.theme;
    INVITES.unshift({ ev:`Тематический эфир: ${theme}`, list: list.filter(c => c.owner==='Аня').map(c => [c.id, 'Не пригласила']) });
    const free = list.filter(c => !c.owner).length;
    toast(`Эфир «${theme}»: ${list.length} клиенток. У менеджеров они появились в «Приглашениях»${free ? `, ${free} без менеджера — у Леры` : ''}`); return; }
  if (d.city){ const c = byId(+d.city); sheet(`<h2>Город: ${esc(c.name)}</h2><form id="cityform" class="grid" data-id="${c.id}"><label class="f">Город<input id="cityinp" value="${esc(c.city==='—'?'':c.city)}" placeholder="Например: Москва"></label>
      <div class="hint">Город приходит из анкеты. Если клиентка сказала в переписке — поправь здесь, он попадёт в фильтр «Город» в базе клиентов.</div>
      <div class="row"><button class="btn pri" type="submit">Сохранить</button><button class="btn" type="button" data-sclose>Отмена</button></div></form>`); return; }
  if (d.themetog){ const [id, t] = d.themetog.split('|'); const c = byId(+id); const th = themesOf(c);
    c.themes = th.includes(t) ? th.filter(x => x!==t) : th.concat(t); openCard(c.id); return; }
  if (d.psec){ prodSection = d.psec; render(); return; }
  if (d.lmtype){ lmType = d.lmtype; render(); return; }

/* ===================== ПИЛОТ: работа с сервером ===================== */
// В демо адрес сервера пустой — работают выдуманные данные. Для пилота сборка вписывает
// адрес сервера в window.PILOT_API: данные приходят только после входа по коду на почту,
// любое изменение карточки или настроек сразу уходит на сервер, а он проверяет права.
const API_URL = window.PILOT_API || '';
const LIVE = !!API_URL;
let TOKEN = ''; try { TOKEN = localStorage.getItem('pilotToken') || ''; } catch (_) {}
let BOOTED = false, ME = null, SNAP = {}, SHARED_SNAP = {}, PEOPLE_SNAP;

async function api(action, data){
  const r = await fetch(API_URL, { method:'POST', body: JSON.stringify(Object.assign({ action, token: TOKEN }, data || {})) });
  const j = await r.json();
  if (!j.ok){ if (/Нужно войти|Вход устарел|Доступ закрыт/.test(j.error || '')) logout(); throw new Error(j.error || 'Сервер не ответил'); }
  return j;
}
const toD = v => v ? new Date(v) : v;
function reviveClient(c){
  ['at','thinkUntil','graveAt'].forEach(k => { if (c[k]) c[k] = toD(c[k]); });
  if (c.task) c.task.due = toD(c.task.due);
  if (c.diag) c.diag.when = toD(c.diag.when);
  if (c.diagPlan) c.diagPlan.when = toD(c.diagPlan.when);
  if (c.alinaVoice) c.alinaVoice.due = toD(c.alinaVoice.due);
  if (c.handoff) c.handoff.due = toD(c.handoff.due);
  c.touches = (c.touches || []).map(t => Object.assign(t, { t: toD(t.t) }));
  c.deals = (c.deals || []).map(d => Object.assign(d, { at: toD(d.at), pays: (d.pays || []).map(p => Object.assign(p, { t: toD(p.t) })) }));
  c.sessions = (c.sessions || []).map(s => Object.assign(s, { t: toD(s.t), end: toD(s.end) }));
  (c.buys || []).forEach(b => b.t = toD(b.t));
  return c;
}
// служебные поля (_undo, _new…) и версия на сервер не уходят и не считаются изменением
const snapOf = c => JSON.stringify(c, (k, v) => (k && (k[0] === '_' || k === 'ver')) ? undefined : v);
const plain = c => Object.assign(JSON.parse(snapOf(c)), { ver: c.ver });
function sharedState(){
  const schedule = {};
  SCHED.forEach(k => { const [m, ds] = k.split('|'); (schedule[m] = schedule[m] || []).push(isoDay(new Date(ds))); });
  return { prices: PRICES, expenses: EXPENSES, magnets: MAGNETS, invites: INVITES, unmatched: UNMATCHED, schedule };
}
const replaceAll = (arr, items) => { arr.length = 0; (items || []).forEach(x => arr.push(x)); };

async function boot(){
  try {
    const b = await api('bootstrap');
    ME = b.me; TODAY.setTime(Date.now());
    replaceAll(C, b.clients.map(reviveClient));
    if (b.shared.prices) replaceAll(PRICES, b.shared.prices.map(p => Object.assign(p, { from: toD(p.from) })));
    replaceAll(EXPENSES, (b.shared.expenses || []).map(x => Object.assign(x, { t: toD(x.t) })));
    if (b.shared.magnets && b.shared.magnets.length) replaceAll(MAGNETS, b.shared.magnets);
    replaceAll(INVITES, b.shared.invites || []);
    replaceAll(UNMATCHED, (b.shared.unmatched || []).map(x => Object.assign(x, { t: toD(x.t) })));
    replaceAll(DUPS, b.shared.dups || []);
    replaceAll(OTHER_EVENTS, []);
    replaceAll(PEOPLE, (b.people || []).map(p => Object.assign({ note: p.open ? '' : 'доступ закрыт' }, p)));
    SCHED.clear(); Object.entries(b.shared.schedule || {}).forEach(([m, days]) => days.forEach(ds => SCHED.add(m + '|' + new Date(ds + 'T12:00').toDateString())));
    Object.keys(SHIFTS).forEach(k => delete SHIFTS[k]);
    Object.entries(b.shared.shifts || {}).forEach(([m, o]) => { SHIFTS[m] = {}; Object.entries(o).forEach(([d, v]) => SHIFTS[m][d] = v.slice(0, 2)); });
    SNAP = {}; C.forEach(c => SNAP[c.id] = snapOf(c));
    SHARED_SNAP = {}; Object.entries(sharedState()).forEach(([k, v]) => SHARED_SNAP[k] = JSON.stringify(v));
    PEOPLE_SNAP = JSON.stringify(PEOPLE);
    Object.entries(ME.levels || {}).forEach(([n, l]) => { if (!ROLES[n]) ROLES[n] = ROLES[l]; if (!ROLE_NOTE[n]) ROLE_NOTE[n] = ROLE_NOTE[l]; });
    ACCESS[ME.name] = ME.access; login = ME.name;
    if (!ACCESS[ME.name].includes(role)) role = ME.name;
    if (!ROLES[role].includes(tab)) tab = ROLES[role][0];
    BOOTED = true; render();
    const m = location.hash.match(/^#k(\d+)$/); if (m && byId(+m[1])) openCard(+m[1]);
  } catch (err) { if (!TOKEN) loginScreen(); else toast(err.message); }
}

// автосохранение: после каждой отрисовки сравниваем с тем, что уже на сервере
function persist(){
  if (!LIVE || !BOOTED) return;
  C.forEach(c => {
    if (c._new){
      if (c._creating) return;
      c._creating = true;
      api('client.create', { client: plain(c) }).then(r => { delete c._new; delete c._creating; c.id = r.id; c.ver = r.ver; SNAP[c.id] = snapOf(c); render(); })
        .catch(err => { c._creating = false; toast(err.message); });
      return;
    }
    const s = snapOf(c);
    if (SNAP[c.id] === undefined){ SNAP[c.id] = s; return; }
    if (SNAP[c.id] === s || c._saving) return;
    const prev = SNAP[c.id]; SNAP[c.id] = s; c._saving = true;
    api('client.save', { client: plain(c) })
      .then(r => { c.ver = r.ver; c._saving = false; if (snapOf(c) !== SNAP[c.id]) persist(); })
      .catch(err => { c._saving = false; SNAP[c.id] = prev; toast(err.message); if (/изменил кто-то другой/.test(err.message)) boot(); });
  });
  Object.entries(sharedState()).forEach(([k, v]) => {
    const s = JSON.stringify(v);
    if (SHARED_SNAP[k] === undefined || SHARED_SNAP[k] === s) { SHARED_SNAP[k] = s; return; }
    SHARED_SNAP[k] = s; api('shared.save', { key: k, value: JSON.parse(s) }).catch(err => toast(err.message));
  });
  const ps = JSON.stringify(PEOPLE);
  if (PEOPLE_SNAP !== ps && ME && ['Пётр','Алина'].includes(ME.level)){ PEOPLE_SNAP = ps; api('people.save', { people: PEOPLE }).catch(err => toast(err.message)); }
}

function loginScreen(step, email){
  BOOTED = false; $('#nav').innerHTML = ''; $('#roles').innerHTML = ''; $('#whoami').textContent = 'Вход';
  $('#view').innerHTML = `<section class="panel" style="max-width:420px;width:100%;margin:32px auto;display:flex;flex-direction:column;gap:12px">
    <h1>Вход</h1><p class="muted">Платформа отдела продаж Алины Агеевой</p>
    ${step==='code'
      ? `<form id="codeform" class="grid" data-email="${esc(email)}"><p class="small">Код отправили на ${esc(email)}. Он действует 15 минут. Нет письма — загляни в «Спам».</p>
          <label class="f">Код из письма<input id="lc" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></label>
          <div class="row"><button class="btn pri" type="submit">Войти</button><button class="btn" type="button" data-relogin>Другая почта</button></div></form>`
      : `<form id="mailform" class="grid"><label class="f">Рабочая почта<input id="lm" type="email" autocomplete="email" required></label>
          <button class="btn pri" type="submit">Получить код</button><p class="small muted">Паролей нет: на почту придёт код. На этом устройстве вход запомнится на 30 дней.</p></form>`}
  </section>`;
}
function logout(){ TOKEN = ''; try { localStorage.removeItem('pilotToken'); } catch (_) {} $('#layer').innerHTML = ''; loginScreen(); }

if (LIVE){ document.querySelector('.proto').hidden = true; TOKEN ? boot() : loginScreen(); }
else render();
</script>
